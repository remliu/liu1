<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0b2239">
  <link rel="icon" href="/static/app.ico">
  <title>WebScan SOP · 网站漏洞扫描标准作业平台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 0 5 22zM5 4.5V22M9 7h7M9 11h7M9 15h4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 2.3M12 17.2v.1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8 7.5 9.5 4.4-1.5 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark">WS</span>
      <span class="brand-text"><strong>WebScan SOP</strong><small>网站漏洞扫描标准作业平台</small></span>
    </a>

    <div class="nav-section-label">工作台</div>
    <nav class="nav">
      <a class="nav-item" data-nav="dashboard" href="#/dashboard"><svg class="ico"><use href="#i-grid"/></svg><span>总览</span></a>
      <a class="nav-item" data-nav="projects" href="#/projects"><svg class="ico"><use href="#i-folder"/></svg><span>项目</span></a>
      <a class="nav-item" data-nav="library" href="#/library"><svg class="ico"><use href="#i-book"/></svg><span>SOP 流程库</span></a>
      <a class="nav-item" data-nav="metrics" href="#/metrics"><svg class="ico"><use href="#i-chart"/></svg><span>质量指标</span></a>
    </nav>

    <div class="nav-section-label">说明</div>
    <nav class="nav">
      <a class="nav-item" data-nav="about" href="#/about"><svg class="ico"><use href="#i-help"/></svg><span>关于与使用</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="local-pill"><span class="dot"></span> LOCAL · SQLite</div>
      <p>单项目 10 步闭环<br>第 6 步 6.1–6.9 顺序</p>
      <small>v1.1.0 · 仅限授权测试</small>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="topbar-title">
        <span class="eyebrow" id="page-eyebrow">WORKSPACE</span>
        <h1 id="page-title">总览</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="refresh-btn" title="刷新数据">刷新</button>
        <button class="btn btn-primary" id="new-project-btn"><svg class="ico"><use href="#i-plus"/></svg>新建项目</button>
      </div>
    </header>

    <main class="view" id="view">
      <div class="loading-state"><div class="spinner"></div><p>正在加载工作台…</p></div>
    </main>
  </div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/static/app.js"></script>
</body>
</html>
