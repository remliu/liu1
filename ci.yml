name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check app starts
        env:
          DB_PATH: /tmp/webscan-sop.db
        run: |
          python app.py &
          APP_PID=$!
          trap "kill $APP_PID 2>/dev/null || true" EXIT
          sleep 2
          python - <<'PY'
          from urllib.request import urlopen
          body = urlopen("http://127.0.0.1:8765/api/health", timeout=5).read().decode()
          assert '"ok": true' in body, body
          print(body)
          PY
