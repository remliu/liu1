[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan-sop"
version = "1.1.0"
description = "A zero-dependency web app for running a 10-step website vulnerability scanning SOP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "WebScan SOP contributors" }]
keywords = ["security", "vulnerability-scanning", "sop", "checklist", "web"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/your-org/webscan-sop"

[tool.setuptools]
py-modules = ["app"]
